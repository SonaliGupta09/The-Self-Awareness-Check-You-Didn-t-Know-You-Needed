<!DOCTYPE html>
<html>
<head>
  <title>Emotional Awareness Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px;
      background: white;
      min-height: 100vh;
    }

    h1 {
      font-size: 26px;
    }

    .question {
      margin-top: 30px;
      font-size: 18px;
    }

    .option {
      display: block;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      background: #f0f0f0;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .result-box {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      background: #fafafa;
    }

    .small {
      color: gray;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>The Emotion You Might Be Misreading</h1>
<p class="small">This isn’t about right or wrong. It’s about awareness.</p>

<div id="quiz"></div>
<button onclick="nextQuestion()">Next</button>

<div id="result"></div>

</div>

<script>

let currentQ = 0;
let answers = [];

const questions = [
{
q: "You put effort into something that mattered to you, but the response feels unclear.",
options: ["Shame","Frustration","Regret","Envy"],
correct: "Frustration",
explain: "Frustration arises when effort doesn’t meet expectation.",
whyNot: ["Shame = feeling flawed","Regret = past-focused","Envy = comparison"],
tip: "Ask for clarity instead of assuming meaning.",
type: "FR"
},

{
q: "You see someone getting recognition you wanted.",
options: ["Envy","Betrayal","Disappointment","Pride"],
correct: "Envy",
explain: "Envy is wanting what someone else received.",
whyNot: ["Betrayal = broken trust","Disappointment = passive","Pride = opposite"],
tip: "Use envy to identify what you value.",
type: "EN"
},

{
q: "You feel drained but keep going.",
options: ["Burnout","Anxiety","Determination","Guilt"],
correct: "Burnout",
explain: "Burnout is prolonged exhaustion.",
whyNot: ["Anxiety = worry","Determination = energizing","Guilt = moral emotion"],
tip: "Rest before exhaustion becomes collapse.",
type: "BU"
},

{
q: "You feel uncertain about your future.",
options: ["Insecurity","Excitement","Anger","Hope"],
correct: "Insecurity",
explain: "Insecurity is uncertainty tied to self-doubt.",
whyNot: ["Excitement = positive","Anger = reactive","Hope = optimistic"],
tip: "Focus on controllable actions today.",
type: "IN"
},

{
q: "You doubt your ability when thinking about the future.",
options: ["Fear","Insecurity","Anxiety","Frustration"],
correct: "Insecurity",
explain: "Insecurity includes self-doubt.",
whyNot: ["Fear = immediate threat","Anxiety = general worry","Frustration = blockage"],
tip: "Separate situation from self-worth.",
type: "IN"
},

{
q: "Things feel repetitive and uninteresting.",
options: ["Boredom","Frustration","Anxiety","Contentment"],
correct: "Boredom",
explain: "Boredom comes from lack of stimulation.",
whyNot: ["Frustration = resistance","Anxiety = worry","Contentment = peace"],
tip: "Introduce novelty, even in small ways.",
type: "BO"
},

{
q: "You feel constantly drained and overwhelmed.",
options: ["Guilt","Frustration","Anxiety","Burnout"],
correct: "Burnout",
explain: "Burnout is emotional + physical exhaustion.",
whyNot: ["Guilt = moral","Frustration = situational","Anxiety = mental"],
tip: "Reduce load before pushing further.",
type: "BU"
},

{
q: "You struggle to say no due to others’ perception.",
options: ["Fear","Insecurity","Anxiety","Frustration"],
correct: "Insecurity",
explain: "This reflects self-worth concerns.",
whyNot: ["Fear = immediate","Anxiety = general","Frustration = blocked goal"],
tip: "Boundaries define value, not reduce it.",
type: "IN"
},

{
q: "You keep scrolling and can’t focus.",
options: ["Boredom","Frustration","Anxiety","Contentment"],
correct: "Boredom",
explain: "Distraction often signals boredom.",
whyNot: ["Frustration = effort blocked","Anxiety = restlessness","Contentment = calm"],
tip: "Replace distraction with slight engagement.",
type: "BO"
},

{
q: "You keep rechecking things.",
options: ["Perfectionism","Anxiety","Distrust","Control"],
correct: "Anxiety",
explain: "Overchecking is anxiety-driven.",
whyNot: ["Perfectionism = trait","Distrust = belief","Control = behavior"],
tip: "Done is often better than perfect.",
type: "AN"
},

{
q: "You receive praise but feel uncomfortable.",
options: ["Gratitude","Embarrassment","Humility","Pride"],
correct: "Pride",
explain: "Pride is core emotion of achievement.",
whyNot: ["Embarrassment = secondary","Gratitude = outward","Humility = trait"],
tip: "Allow yourself to accept recognition.",
type: "PR"
},

{
q: "You feel calm satisfaction after finishing something.",
options: ["Joy","Relief","Contentment","Pride"],
correct: "Contentment",
explain: "Contentment is quiet satisfaction.",
whyNot: ["Joy = high energy","Relief = tension release","Pride = achievement focus"],
tip: "Notice quiet fulfillment moments.",
type: "CO"
}
];

function loadQuestion() {
  let q = questions[currentQ];
  let html = `<div class="question"><b>Q${currentQ+1}:</b> ${q.q}</div>`;
  
  q.options.forEach(opt => {
    html += `<label class="option">
    <input type="radio" name="option" value="${opt}"> ${opt}
    </label>`;
  });

  document.getElementById("quiz").innerHTML = html;
}

function nextQuestion() {
  let selected = document.querySelector('input[name="option"]:checked');
  if (!selected) return alert("Please select an option");

  answers.push(selected.value);
  currentQ++;

  if (currentQ < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {

  let score = 0;
  let typeCount = {};

  questions.forEach((q, i) => {
    if (answers[i] === q.correct) score++;
    typeCount[q.type] = (typeCount[q.type] || 0) + 1;
  });

  let dominant = Object.keys(typeCount).reduce((a,b)=> typeCount[a]>typeCount[b]?a:b);

  let resultText = "";

  if (score >= 9) {
    resultText = "You are emotionally precise. You can distinguish subtle emotions clearly—but awareness must turn into action.";
  } else if (dominant === "IN") {
    resultText = "You tend to interpret situations through self-doubt. You are reflective—but slightly harsh on yourself.";
  } else if (dominant === "BU") {
    resultText = "You keep going even when drained. You ignore early emotional signals.";
  } else if (dominant === "BO") {
    resultText = "You disengage when things lack meaning. Distraction replaces clarity.";
  } else {
    resultText = "You show balanced emotional awareness.";
  }

  let review = "<div class='result-box'><h3>Your Insight</h3><p>"+resultText+"</p></div>";
  review += "<h3>Answer Breakdown</h3>";

  questions.forEach((q, i) => {
    review += `<div class='result-box'>
    <b>Q${i+1}:</b> ${q.q}<br>
    Your answer: ${answers[i]}<br>
    Most accurate: ${q.correct}<br><br>

    🧠 ${q.explain}<br>
    - ${q.whyNot.join("<br>- ")}<br><br>

    💡 ${q.tip}
    </div>`;
  });

  document.getElementById("quiz").innerHTML = "";
  document.querySelector("button").style.display = "none";

  document.getElementById("result").innerHTML = review;
}

loadQuestion();

</script>

</body>
</html>
