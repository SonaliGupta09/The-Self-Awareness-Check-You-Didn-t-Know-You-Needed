<!DOCTYPE html>
<html>
<head>
  <title>Emotional Awareness Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f7;
      margin: 0;
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 30px;
      background: white;
      min-height: 100vh;
    }

    h1 { font-size: 26px; }

    .question {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.5;
    }

    .option {
      display: block;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
    }

    .option:hover { background: #f0f0f0; }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .result-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #fafafa;
    }

    .small {
      color: gray;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>The Emotion You Might Be Misreading</h1>
<p class="small">This isn’t about right or wrong. It’s about noticing what you usually miss.</p>

<div id="quiz"></div>
<button onclick="nextQuestion()">Next</button>

<div id="result"></div>

</div>

<script>

let currentQ = 0;
let answers = [];
let selectedTypes = [];

const questions = [

{
q: "You put genuine effort into something that mattered to you, but the response feels unclear or underwhelming.",
options: [
{text:"Shame", type:"SH"},
{text:"Frustration", type:"FR"},
{text:"Regret", type:"RG"},
{text:"Envy", type:"EN"}
],
correct: "Frustration",
explain: "Frustration arises when effort doesn’t meet expectation.",
whyNot: ["Shame = feeling flawed","Regret = past-focused","Envy = comparison"],
tip: "Seek clarity instead of assuming meaning."
},

{
q: "You see someone getting recognition you wanted.",
options: [
{text:"Envy", type:"EN"},
{text:"Betrayal", type:"BT"},
{text:"Disappointment", type:"DS"},
{text:"Pride", type:"PR"}
],
correct: "Envy",
explain: "Envy is wanting what someone else has.",
whyNot: ["Betrayal = broken trust","Disappointment = passive","Pride = opposite"],
tip: "Use envy to understand your desires."
},

{
q: "You feel drained but keep going.",
options: [
{text:"Burnout", type:"BU"},
{text:"Anxiety", type:"AN"},
{text:"Determination", type:"DE"},
{text:"Guilt", type:"GU"}
],
correct: "Burnout",
explain: "Burnout is prolonged exhaustion.",
whyNot: ["Anxiety = worry","Determination = energizing","Guilt = moral"],
tip: "Rest before burnout deepens."
},

{
q: "You feel uncertain about your future.",
options: [
{text:"Insecurity", type:"IN"},
{text:"Excitement", type:"EX"},
{text:"Anger", type:"AG"},
{text:"Hope", type:"HO"}
],
correct: "Insecurity",
explain: "Insecurity includes self-doubt + uncertainty.",
whyNot: ["Excitement = positive","Anger = reactive","Hope = optimistic"],
tip: "Focus on controllable actions."
},

{
q: "You doubt your ability while thinking about future.",
options: [
{text:"Fear", type:"FE"},
{text:"Insecurity", type:"IN"},
{text:"Anxiety", type:"AN"},
{text:"Frustration", type:"FR"}
],
correct: "Insecurity",
explain: "Self-doubt makes it insecurity.",
whyNot: ["Fear = immediate","Anxiety = general","Frustration = blocked"],
tip: "Separate situation from self-worth."
},

{
q: "Things feel repetitive and uninteresting.",
options: [
{text:"Boredom", type:"BO"},
{text:"Frustration", type:"FR"},
{text:"Anxiety", type:"AN"},
{text:"Contentment", type:"CO"}
],
correct: "Boredom",
explain: "Boredom comes from lack of stimulation.",
whyNot: ["Frustration = resistance","Anxiety = worry","Contentment = peace"],
tip: "Introduce novelty."
},

{
q: "You feel constantly drained and overwhelmed.",
options: [
{text:"Guilt", type:"GU"},
{text:"Frustration", type:"FR"},
{text:"Anxiety", type:"AN"},
{text:"Burnout", type:"BU"}
],
correct: "Burnout",
explain: "Burnout = exhaustion + strain.",
whyNot: ["Guilt = moral","Frustration = situational","Anxiety = mental"],
tip: "Pause before it worsens."
},

{
q: "You struggle to say no due to others’ perception.",
options: [
{text:"Fear", type:"FE"},
{text:"Insecurity", type:"IN"},
{text:"Anxiety", type:"AN"},
{text:"Frustration", type:"FR"}
],
correct: "Insecurity",
explain: "Self-worth concern = insecurity.",
whyNot: ["Fear = immediate","Anxiety = general","Frustration = blocked"],
tip: "Boundaries build self-respect."
},

{
q: "You keep scrolling and can’t focus.",
options: [
{text:"Boredom", type:"BO"},
{text:"Frustration", type:"FR"},
{text:"Anxiety", type:"AN"},
{text:"Contentment", type:"CO"}
],
correct: "Boredom",
explain: "Distraction signals boredom.",
whyNot: ["Frustration = blocked","Anxiety = restlessness","Contentment = calm"],
tip: "Engage slightly instead of escaping."
},

{
q: "You keep rechecking things.",
options: [
{text:"Perfectionism", type:"PF"},
{text:"Anxiety", type:"AN"},
{text:"Distrust", type:"DT"},
{text:"Control", type:"CT"}
],
correct: "Anxiety",
explain: "Overchecking = anxiety.",
whyNot: ["Perfectionism = trait","Distrust = belief","Control = behavior"],
tip: "Trust completion."
},

{
q: "You receive praise but feel uncomfortable.",
options: [
{text:"Gratitude", type:"GR"},
{text:"Embarrassment", type:"EM"},
{text:"Humility", type:"HU"},
{text:"Pride", type:"PR"}
],
correct: "Pride",
explain: "Pride = achievement emotion.",
whyNot: ["Embarrassment = reaction","Gratitude = outward","Humility = trait"],
tip: "Allow recognition."
},

{
q: "You feel calm satisfaction after finishing something.",
options: [
{text:"Joy", type:"JO"},
{text:"Relief", type:"RE"},
{text:"Contentment", type:"CO"},
{text:"Pride", type:"PR"}
],
correct: "Contentment",
explain: "Contentment = quiet satisfaction.",
whyNot: ["Joy = energetic","Relief = release","Pride = achievement"],
tip: "Notice calm fulfillment."
}

];

function loadQuestion() {
  let q = questions[currentQ];
  let html = `<div class="question"><b>Q${currentQ+1}:</b> ${q.q}</div>`;

  q.options.forEach(opt => {
    html += `<label class="option">
    <input type="radio" name="option" value="${opt.text}" data-type="${opt.type}">
    ${opt.text}
    </label>`;
  });

  document.getElementById("quiz").innerHTML = html;
}

function nextQuestion() {
  let selected = document.querySelector('input[name="option"]:checked');
  if (!selected) return alert("Please select an option");

  answers.push(selected.value);
  selectedTypes.push(selected.dataset.type);

  currentQ++;

  if (currentQ < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {

  let score = 0;
  let typeCount = {};

  questions.forEach((q, i) => {
    if (answers[i] === q.correct) score++;

    let t = selectedTypes[i];
    typeCount[t] = (typeCount[t] || 0) + 1;
  });

  let dominant = Object.keys(typeCount).reduce((a,b)=> typeCount[a]>typeCount[b]?a:b);

  let resultText = "";

  if (score >= 9) {
    resultText = "You are emotionally precise. You can distinguish subtle emotional differences clearly. But awareness must turn into action.";
  } else if (dominant === "IN") {
    resultText = "You tend to interpret situations through self-doubt. You are reflective—but slightly harsh on yourself.";
  } else if (dominant === "BU") {
    resultText = "You tend to push through exhaustion and ignore emotional signals.";
  } else if (dominant === "BO") {
    resultText = "You disengage when things lack meaning and stimulation.";
  } else if (dominant === "AN") {
    resultText = "You tend to overanalyze and feel underlying anxiety.";
  } else {
    resultText = "You show a mixed emotional pattern—your awareness is developing.";
  }

  let review = `<div class='result-box'><h3>Your Insight</h3><p>${resultText}</p></div>`;
  review += "<h3>Answer Breakdown</h3>";

  questions.forEach((q, i) => {
    review += `<div class='result-box'>
    <b>Q${i+1}:</b> ${q.q}<br><br>
    Your answer: ${answers[i]}<br>
    Most accurate: ${q.correct}<br><br>

    🧠 ${q.explain}<br>
    - ${q.whyNot.join("<br>- ")}<br><br>

    💡 ${q.tip}
    </div>`;
  });

  document.getElementById("quiz").innerHTML = "";
  document.querySelector("button").style.display = "none";
  document.getElementById("result").innerHTML = review;
}

loadQuestion();

</script>

</body>
</html>
