<!DOCTYPE html>
<html>
<head>
  <title>Emotional Awareness Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f7;
      margin: 0;
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 30px;
      background: white;
      min-height: 100vh;
    }

    h1 { font-size: 26px; }

    .question {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.6;
    }

    .option {
      display: block;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
    }

    .option:hover { background: #f0f0f0; }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .result-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #fafafa;
    }

    .small {
      color: gray;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>The Emotion You Might Be Misreading</h1>
<p class="small">This isn’t about right or wrong. It’s about noticing what you usually miss.</p>

<div id="quiz"></div>
<button onclick="nextQuestion()">Next</button>

<div id="result"></div>

</div>

<script>

let currentQ = 0;
let answers = [];
let selectedTypes = [];

const questions = [

{
q: "You put genuine effort into something that mattered to you—maybe a message, a plan, or a thoughtful gesture. But the response you receive feels vague or underwhelming. You begin to question whether it was even good enough.",
options: [
{text:"Shame", type:"SH"},
{text:"Frustration", type:"FR"},
{text:"Regret", type:"RG"},
{text:"Envy", type:"EN"}
],
correct: "Frustration",
explain: "Frustration arises when effort doesn’t meet expectation or response.",
whyNot: ["Shame = feeling flawed as a person","Regret = wishing you acted differently","Envy = comparison with others"],
tip: "Seek clarity instead of assuming meaning."
},

{
q: "You see a colleague or peer being appreciated or recognized for something that feels very similar to what you’ve done—or something you wish you were acknowledged for. You feel a quiet heaviness inside.",
options: [
{text:"Envy", type:"EN"},
{text:"Betrayal", type:"BT"},
{text:"Disappointment", type:"DS"},
{text:"Pride", type:"PR"}
],
correct: "Envy",
explain: "Envy is the feeling of wanting recognition or value someone else received.",
whyNot: ["Betrayal = broken trust","Disappointment = passive sadness","Pride = opposite emotion"],
tip: "Use envy to understand what matters to you."
},

{
q: "You’ve been juggling multiple responsibilities for a while now. Even though you feel mentally and emotionally drained, you continue pushing yourself without taking a real break.",
options: [
{text:"Burnout", type:"BU"},
{text:"Anxiety", type:"AN"},
{text:"Determination", type:"DE"},
{text:"Guilt", type:"GU"}
],
correct: "Burnout",
explain: "Burnout is prolonged emotional and mental exhaustion.",
whyNot: ["Anxiety = worry","Determination = energizing","Guilt = moral emotion"],
tip: "Rest before your body forces you to."
},

{
q: "With everything changing around you—career, expectations, or future—you feel uncertain and slightly uneasy about whether things will work out in your favor.",
options: [
{text:"Insecurity", type:"IN"},
{text:"Excitement", type:"EX"},
{text:"Anger", type:"AG"},
{text:"Hope", type:"HO"}
],
correct: "Insecurity",
explain: "Insecurity combines uncertainty with self-doubt.",
whyNot: ["Excitement = positive anticipation","Anger = reactive","Hope = optimistic"],
tip: "Focus on what you can control today."
},

{
q: "You often find yourself thinking ‘what if things don’t work out’—and along with that comes a quiet doubt about your own ability to handle the situation.",
options: [
{text:"Fear", type:"FE"},
{text:"Insecurity", type:"IN"},
{text:"Anxiety", type:"AN"},
{text:"Frustration", type:"FR"}
],
correct: "Insecurity",
explain: "Insecurity includes both uncertainty and self-doubt.",
whyNot: ["Fear = immediate threat","Anxiety = general worry","Frustration = blocked outcome"],
tip: "Separate situation from your self-worth."
},

{
q: "You’ve been doing similar tasks or routines for a long time, and nothing feels particularly engaging anymore. You feel disconnected and uninterested.",
options: [
{text:"Boredom", type:"BO"},
{text:"Frustration", type:"FR"},
{text:"Anxiety", type:"AN"},
{text:"Contentment", type:"CO"}
],
correct: "Boredom",
explain: "Boredom comes from lack of stimulation and engagement.",
whyNot: ["Frustration = resistance","Anxiety = worry","Contentment = satisfaction"],
tip: "Introduce small novelty into your routine."
},

{
q: "You’ve been constantly occupied—mentally or physically—and it’s starting to affect your energy, relationships, and well-being. Yet, you continue pushing through.",
options: [
{text:"Guilt", type:"GU"},
{text:"Frustration", type:"FR"},
{text:"Anxiety", type:"AN"},
{text:"Burnout", type:"BU"}
],
correct: "Burnout",
explain: "Burnout includes both exhaustion and emotional strain.",
whyNot: ["Guilt = moral discomfort","Frustration = situational","Anxiety = mental stress"],
tip: "Pause before exhaustion turns into breakdown."
},

{
q: "You find it difficult to say no to additional work or requests, even when you feel overwhelmed, because you worry about how others might perceive you.",
options: [
{text:"Fear", type:"FE"},
{text:"Insecurity", type:"IN"},
{text:"Anxiety", type:"AN"},
{text:"Frustration", type:"FR"}
],
correct: "Insecurity",
explain: "This reflects concern about your value and perception.",
whyNot: ["Fear = immediate consequence","Anxiety = general worry","Frustration = blocked goal"],
tip: "Boundaries define your value—they don’t reduce it."
},

{
q: "You keep checking your phone, scrolling, or distracting yourself—even when you know you have important things to do. You feel disconnected and unable to focus.",
options: [
{text:"Boredom", type:"BO"},
{text:"Frustration", type:"FR"},
{text:"Anxiety", type:"AN"},
{text:"Contentment", type:"CO"}
],
correct: "Boredom",
explain: "Distraction often signals lack of engagement.",
whyNot: ["Frustration = blocked effort","Anxiety = restlessness","Contentment = calm state"],
tip: "Shift from avoidance to slight engagement."
},

{
q: "Even after completing tasks well, you find yourself rechecking them repeatedly. Letting go feels uncomfortable, and you feel mentally drained by the end of the day.",
options: [
{text:"Perfectionism", type:"PF"},
{text:"Anxiety", type:"AN"},
{text:"Distrust", type:"DT"},
{text:"Control", type:"CT"}
],
correct: "Anxiety",
explain: "Overchecking is driven by underlying anxiety.",
whyNot: ["Perfectionism = trait","Distrust = belief","Control = behavior"],
tip: "Trust that done is enough."
},

{
q: "You receive appreciation or praise for something you’ve done. You feel good, but also slightly uncomfortable being the center of attention.",
options: [
{text:"Gratitude", type:"GR"},
{text:"Embarrassment", type:"EM"},
{text:"Humility", type:"HU"},
{text:"Pride", type:"PR"}
],
correct: "Pride",
explain: "Pride is the core emotion tied to achievement.",
whyNot: ["Embarrassment = reaction","Gratitude = outward","Humility = mindset"],
tip: "Allow yourself to fully receive appreciation."
},

{
q: "You complete something meaningful and take a quiet moment to reflect. You feel calm, fulfilled, and at ease—without needing celebration.",
options: [
{text:"Joy", type:"JO"},
{text:"Relief", type:"RE"},
{text:"Contentment", type:"CO"},
{text:"Pride", type:"PR"}
],
correct: "Contentment",
explain: "Contentment is a calm, steady sense of satisfaction.",
whyNot: ["Joy = energetic","Relief = tension release","Pride = achievement focus"],
tip: "Notice and appreciate these quiet moments."
}

];

function loadQuestion() {
  let q = questions[currentQ];
  let html = `<div class="question"><b>Q${currentQ+1}:</b> ${q.q}</div>`;

  q.options.forEach(opt => {
    html += `<label class="option">
    <input type="radio" name="option" value="${opt.text}" data-type="${opt.type}">
    ${opt.text}
    </label>`;
  });

  document.getElementById("quiz").innerHTML = html;
}

function nextQuestion() {
  let selected = document.querySelector('input[name="option"]:checked');
  if (!selected) return alert("Please select an option");

  answers.push(selected.value);
  selectedTypes.push(selected.dataset.type);

  currentQ++;

  if (currentQ < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {

  let score = 0;
  let typeCount = {};

  questions.forEach((q, i) => {
    if (answers[i] === q.correct) score++;
    let t = selectedTypes[i];
    typeCount[t] = (typeCount[t] || 0) + 1;
  });

  let dominant = Object.keys(typeCount).reduce((a,b)=> typeCount[a]>typeCount[b]?a:b);

  let resultText = "";

  if (score >= 9) {
    resultText = "You are emotionally precise. You can distinguish subtle emotional differences clearly. But awareness must turn into action.";
  } else if (dominant === "IN") {
    resultText = "You tend to interpret situations through self-doubt. You are reflective—but slightly harsh on yourself.";
  } else if (dominant === "BU") {
    resultText = "You tend to push through exhaustion and ignore emotional signals.";
  } else if (dominant === "BO") {
    resultText = "You disengage when things lack meaning and stimulation.";
  } else if (dominant === "AN") {
    resultText = "You tend to overanalyze and feel underlying anxiety.";
  } else {
    resultText = "You show a mixed emotional pattern—your awareness is developing.";
  }

  let review = `<div class='result-box'><h3>Your Insight</h3><p>${resultText}</p></div>`;
  review += "<h3>Answer Breakdown</h3>";

  questions.forEach((q, i) => {
    review += `<div class='result-box'>
    <b>Q${i+1}:</b> ${q.q}<br><br>
    Your answer: ${answers[i]}<br>
    Most accurate: ${q.correct}<br><br>

    🧠 ${q.explain}<br>
    - ${q.whyNot.join("<br>- ")}<br><br>

    💡 ${q.tip}
    </div>`;
  });

  document.getElementById("quiz").innerHTML = "";
  document.querySelector("button").style.display = "none";
  document.getElementById("result").innerHTML = review;
}

loadQuestion();

</script>

</body>
</html>
